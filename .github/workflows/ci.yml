name: Verify composed package metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatial-package-composition
  cancel-in-progress: false

env:
  COMPOSED: ddfc1a3f4581f8855eba4aacbe3724d06b57ee34
  APPLE_BASE: 7fa674907597f6a19e319b25c93dc9e4474be4a6
  NATIVE_BASE: 2eb62ea10fc7a010306f5aee877970a565d51390

jobs:
  metadata:
    if: github.repository == 'kristofferR/mpv-build' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validate/spatial-package-composition'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify composition scope and immutable asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          composed = os.environ['COMPOSED']
          apple_base = os.environ['APPLE_BASE']
          native_base = os.environ['NATIVE_BASE']

          def git(*args):
              return subprocess.check_output(['git', *args])

          def blob(revision, path):
              return git('show', f'{revision}:{path}')

          expected = {
              'artifacts.json', 'versions.json',
              'platforms/windows/pin_packages.py',
              'platforms/windows/testdata/PROVENANCE',
              'platforms/windows/testdata/libaribcaption.cmake',
          }
          actual = set(git('diff', '--name-only', apple_base, composed).decode().splitlines())
          assert actual == expected, actual
          assert git('show', '-s', '--format=%P', composed).decode().strip().split() == [apple_base, native_base]
          assert git('diff', '--name-only', composed, 'HEAD').decode().splitlines() == ['.github/workflows/ci.yml']
          assert blob(composed, 'Package.swift') == blob(apple_base, 'Package.swift')
          for path in expected - {'artifacts.json', 'versions.json'}:
              assert blob(composed, path) == blob(native_base, path), path
          versions = json.loads(blob(composed, 'versions.json'))
          base_versions = json.loads(blob(apple_base, 'versions.json'))
          upstream_versions = json.loads(blob(native_base, 'versions.json'))
          base_versions['components']['libaribcaption'] = upstream_versions['components']['libaribcaption']
          assert versions == base_versions
          assert versions['components']['spatialaudiobridge']['commit'] == '8d8f21a35d27179fe1b04a6c24a9db89b1d2a364'

          manifest = json.loads(blob(composed, 'artifacts.json'))
          base_manifest = json.loads(blob(apple_base, 'artifacts.json'))
          upstream_manifest = json.loads(blob(native_base, 'artifacts.json'))
          assert manifest['platforms']['apple'] == base_manifest['platforms']['apple']
          expected_manifest = base_manifest
          for group in ('android', 'linux', 'windows'):
              expected_manifest['platforms'][group] = upstream_manifest['platforms'][group]
          assert manifest == expected_manifest
          assert Path('artifacts.json').read_bytes() == blob(composed, 'artifacts.json')
          print(f'Composition {composed}: exact five-file scope, merge parents and Windows provenance verified')
          print('Apple package, manifest section and all other source/build/wrapper files unchanged')

          digest_count = 0
          asset_count = 0
          for group, section in manifest['platforms'].items():
              base = section['assetBase']
              url = urlparse(base)
              owner, repo, releases, download, tag = url.path.strip('/').split('/')
              assert url.scheme == 'https' and url.netloc == 'github.com'
              assert (releases, download) == ('releases', 'download')
              assert (owner, repo, tag) == ('kristofferR' if group == 'apple' else 'edde746', 'mpv-build', f'binaries-{group}')
              release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{owner}/{repo}/releases/tags/{tag}']))
              assets = {asset['name']: asset for asset in release['assets']}
              references = {}
              for library in section['libraries'].values():
                  for value in library.get('prebuilt', {}).values():
                      if isinstance(value, str):
                          references[value] = None
                      else:
                          references[value['asset']] = value['checksum']
                  for value in library.get('frameworks', {}).values():
                      references[value['asset']] = value['checksum']
              for name, checksum in references.items():
                  asset = assets[name]
                  assert asset['state'] == 'uploaded' and asset['size'] > 0, name
                  assert asset['browser_download_url'] == f'{base}/{name}', name
                  if checksum is not None:
                      assert asset['digest'] == f'sha256:{checksum}', name
                      digest_count += 1
                  asset_count += 1
              print(f'{group}: {len(references)} existing assets verified; keys ' + ', '.join(lib['key'] for lib in section['libraries'].values()))
          print(f'{asset_count} assets exist; {digest_count} recorded SHA256 digests match release metadata; no assets downloaded or uploaded')
          PY
      - name: Verify every platform content key
        run: |
          for group in $(python3 scripts/keys.py groups); do
            python3 scripts/keys.py verify --platform-group "$group"
          done
      - name: Test existing Windows package pin harness
        run: python3 platforms/windows/test_pin_packages.py
