name: Publish binaries

# This fork validation branch publishes Apple's binaries only on dispatch.
# Asset names are content-addressed (they carry a key derived
# from the sources that produced them), which makes them immutable: an asset
# that already exists on a rolling prerelease is byte-identical to the one this
# run would upload, so it is skipped instead of clobbered.
#
# Binaries are sharded per platform group. Each group builds independently,
# uploads to its own `binaries-<group>` rolling prerelease and contributes only
# its own `platforms.<group>` section of artifacts.json; one final job splices
# the sections together and commits the manifest. The plan job's group list
# comes from `scripts/keys.py groups` (which discovers platforms/*/group.json),
# and the recording step is one matrix job shared by every group.json group --
# only apple, whose build is defined in the Swift driver, has a job of its own.
# Those two are not derived from the group list: the matrix row names the group
# and the uploaded-artifact prefix its build job uploads, and the build job
# itself is per platform, so a new group is a group.json, its build job, and a
# row in the record matrix below.
on:
  workflow_dispatch:
    inputs:
      bridge_only:
        description: Compile only the private Swift bridge with Xcode 26.6
        type: boolean
        default: false
      publish:
        description: Publish validated binaries and commit their manifest (requires coordinator approval)
        type: boolean
        default: false
      inspect_run:
        description: Inspect an existing run's packaged cores without rebuilding or publishing
        type: string
        default: ''

# This validation branch only publishes Apple's artifacts to Kris's fork.
env:
  GH_REPO: kristofferR/mpv-build

# Two runs must never interleave asset uploads or commits to their branch, and a
# cancelled run could leave the manifest committed without its assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  workflow-check:
    name: Validate fork workflow
    if: github.repository == 'kristofferR/mpv-build' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the dispatch workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/publish.yml

  inspect-archives:
    name: Inspect packaged spatial cores
    needs: workflow-check
    if: inputs.inspect_run != '' && !inputs.publish
    permissions:
      contents: read
      actions: read
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.inspect_run }}
          pattern: apple-*
          path: ./dist/inspection
      - name: Verify packaged core exports and deployment targets
        run: |
          command -v uv || brew install uv
          uv run --no-project python scripts/inspect_spatial_packages.py dist/inspection

  bridge-check:
    name: Check spatial bridge on Xcode 26.6
    needs: workflow-check
    if: inputs.inspect_run == ''
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select and report Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun swiftc -version
      - name: Compile the pinned renderer and private bridge
        shell: bash
        run: |
          command -v uv || brew install uv
          source_dir="$RUNNER_TEMP/spatial-source"
          mpv_dir="$RUNNER_TEMP/mpv-source"
          output="$RUNNER_TEMP/spatial-check"
          uv run --no-project python scripts/patches.py fetch-pinned spatialaudiobridge apple "$source_dir"
          uv run --no-project python scripts/patches.py fetch-pinned mpv apple "$mpv_dir"
          mkdir -p "$output"
          printf 'import Foundation\nlet mpSpatialSilentAtmos = Data(base64Encoded: "%s")!\n' \
            "$(base64 < "$source_dir/Sources/SpatialAudioPlayback/Resources/silent-atmos.mp4" | tr -d '\n')" > "$output/SpatialResources.swift"
          sources=()
          for name in Types Decoder APACEncoder SampleBuffer IEC61937Unpacker SpatialAudioRenderer SpatialAudioTranscoder FragmentTrim; do
            sources+=("$source_dir/Sources/SpatialAudioBridge/$name.swift")
          done
          xcrun swiftc -swift-version 6 -O -whole-module-optimization -parse-as-library \
            -emit-library -static -module-name MPVSpatial -target arm64-apple-macos11.0 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" -I "$source_dir/Rust/SpatialAudioCore/include" \
            "${sources[@]}" "$source_dir/Sources/SpatialAudioPlayback/AtmosOutputActivator.swift" \
            "$mpv_dir/audio/out/ao_spatial.swift" "$output/SpatialResources.swift" \
            -o "$output/libmpv_spatial.a"
          ls -lh "$output/libmpv_spatial.a"

  tests:
    name: Patch regression tests
    needs: bridge-check
    if: github.repository == 'kristofferR/mpv-build' && github.event_name == 'workflow_dispatch' && !inputs.bridge_only
    permissions:
      contents: read
    # The harnesses need only bash, python3 and cc (plus libass's host
    # dependencies for one of them, and Xcode for the apple merge test), but
    # not a Linux cc:
    # test_avf_timebase_servo.c uses M_PI under -std=c11, which glibc hides in
    # strict ISO mode (gcc 13 on ubuntu-24.04: "'M_PI' undeclared"), while
    # Apple libc exposes it. Keep them on the compiler they are written for.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select and report Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun swiftc -version

      - name: Test AO PCM lookahead
        run: ./scripts/test_ao_pcm_lookahead.sh

      - name: Test AO compressed-audio option
        run: ./scripts/test_ao_compressed_audio_option.sh

      - name: Test AO probe refusal
        run: ./scripts/test_ao_probe_refusal.sh

      - name: Test spatial audio output
        run: bash ./scripts/test_ao_spatial.sh

      - name: Test spatial audio session ownership
        run: bash ./scripts/test_spatial_session.sh

      - name: Test AVFoundation timebase servo
        run: ./scripts/test_avf_timebase_servo.sh

      - name: Test AVFoundation PiP frame-space OSD
        run: ./scripts/test_avf_pip_frame_space_osd.sh

      - name: Test AVFoundation subtitle wait policy
        run: ./scripts/test_avf_osd_ahead.sh

      - name: Test MediaCodec timing cadence
        run: bash ./scripts/test_mediacodec_timing.sh

      - name: Test MediaCodec vsync sampler under Android 11 mode switches
        run: bash ./scripts/test_mediacodec_vsync.sh

      - name: Test MediaCodec subtitle geometry
        run: bash ./scripts/test_mediacodec_geometry.sh

      - name: Test MediaCodec OSD scheduler
        run: bash ./scripts/test_mediacodec_osd.sh

      - name: Test MediaCodec OSD surface retirement
        run: bash ./scripts/test_mediacodec_rebind.sh

      - name: Test MediaCodec OSD-plane letterbox fill
        run: bash ./scripts/test_mediacodec_letterbox.sh

      - name: Test decoder busy policy past end of stream
        run: bash ./scripts/test_lavc_busy_policy.sh

      - name: Test MediaCodec Dolby Vision packet filter
        run: bash ./scripts/test_mediacodec_dv_filter.sh

      - name: Test MediaCodec input sizing and submission
        run: bash ./scripts/test_mediacodec_input.sh

      - name: Test MediaCodec end of stream after a flush
        run: bash ./scripts/test_mediacodec_eos.sh

      - name: Test MediaCodec flush before the first input
        run: bash ./scripts/test_mediacodec_flush.sh

      - name: Test MediaCodec errors across a flush
        run: bash ./scripts/test_mediacodec_error.sh

      - name: Test MediaCodec output crop transitions
        run: bash ./scripts/test_mediacodec_crop.sh

      - name: Test MediaCodec rendered-frame feedback ring
        run: bash ./scripts/test_mediacodec_rendered.sh

      - name: Test MediaCodec pre-decode frame shedding
        run: bash ./scripts/test_mediacodec_shed.sh

      - name: Test MediaCodec presentation order for decode-order timestamps
        run: bash ./scripts/test_mediacodec_reorder.sh

      - name: Test the core's frame queue for a self-timed VO
        run: bash ./scripts/test_player_queue_frames.sh

      - name: Test the audio output reload with a frame held for the old AO
        run: bash ./scripts/test_audio_reload_held_frame.sh

      - name: Test the codec profile the Android demuxers publish at load
        run: bash ./scripts/test_demux_codec_profile.sh

      - name: Test PGS palette cache across an epoch
        run: bash ./scripts/test_pgs_palette.sh

      - name: Test TCP hostname lookup by address family
        run: bash ./scripts/test_tcp_family_lookup.sh

      - name: Test Android AudioTrack deadline timing
        run: bash ./scripts/test_audiotrack_timing.sh

      # The one harness that builds a dependency: the libass series' layout
      # cache is only observable through ass_render_frame itself.
      - name: Install libass host dependencies
        run: brew install autoconf automake libtool pkgconf freetype fribidi harfbuzz libunibreak

      - name: Test libass series harnesses
        run: bash ./scripts/test_libass_series.sh

      - name: Test patch framework
        run: ./scripts/test_patches.sh

      - name: Test shared extractor
        run: ./scripts/test_extract.sh

      - name: Test content keys
        run: ./scripts/test_keys.sh

      - name: Test apple XCFramework merge reproducibility
        run: ./scripts/test_apple_merge.sh

  plan:
    name: Plan
    needs: tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # The stale libraries of the apple group, comma-separated: the `libs=`
      # argument the apple build legs need.
      stale_apple: ${{ steps.stale.outputs.stale_apple }}
      # The stale groups with both delimiters (`,apple,android,`), so a gate is
      # an exact `contains(..., ',<group>,')` test rather than a substring
      # guess. Empty when every group is already published, which is what skips
      # the build, publish and manifest jobs.
      stale_groups: ${{ steps.stale.outputs.stale_groups }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate patch series
        run: python3 scripts/patches.py check

      - name: Compute stale libraries per group
        id: stale
        # shell: bash adds pipefail, which the default `bash -e` lacks, so a
        # crash in keys.py is not swallowed by the pipe into paste.
        shell: bash
        run: |
          # Only Apple binaries are authorized for this fork validation.
          groups="apple"
          echo "groups=${groups}" >> "$GITHUB_STEP_SUMMARY"

          stale_groups=""
          for group in ${groups}; do
            stale="$(python3 scripts/keys.py stale --platform-group "${group}" | paste -sd, -)"
            if [ -n "${stale}" ]; then
              stale_groups="${stale_groups},${group}"
              echo "${group}: rebuilding ${stale}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${group}: binaries already published for this tree" >> "$GITHUB_STEP_SUMMARY"
              # Nothing to build means the committed manifest must already
              # describe this tree exactly, otherwise the commit is not
              # pinnable and no later job would notice.
              python3 scripts/keys.py verify --platform-group "${group}"
            fi
            if [ "${group}" = "apple" ]; then
              echo "stale_apple=${stale}" >> "$GITHUB_OUTPUT"
            fi
          done
          # Both delimiters, so `contains(..., ',<group>,')` is an exact test:
          # a bare trailing group (`...,apple`) would otherwise not match.
          # Empty when nothing is stale, which is what skips the later jobs.
          if [ -n "${stale_groups}" ]; then
            echo "stale_groups=${stale_groups}," >> "$GITHUB_OUTPUT"
          else
            echo "stale_groups=" >> "$GITHUB_OUTPUT"
          fi

  build-apple:
    name: Build apple ${{ matrix.name }}
    needs: plan
    if: contains(needs.plan.outputs.stale_groups, ',apple,')
    permissions:
      contents: read
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            platforms: macos
            platform_type: macos
          - name: maccatalyst
            platforms: maccatalyst
            platform_type: maccatalyst
          - name: iphoneos
            platforms: ios-device
            platform_type: ios
          - name: iphonesimulator
            platforms: ios-simulator
            platform_type: isimulator
          - name: tvos
            platforms: tvos-device
            platform_type: tvos
          - name: tvsimulator
            platforms: tvos-simulator
            platform_type: tvsimulator
    steps:
      - uses: actions/checkout@v4

      - name: Select and report Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun swiftc -version

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool ninja uv
          uv tool install meson==1.4.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Only the stale libraries are compiled; the rest are restored from their
      # published per-platform zips. No version= argument: the URLs the build
      # script would spell from it are replaced by the manifest's
      # content-addressed ones in the publish job.
      - name: Install the pinned Rust toolchain
        run: |
          rust_version="$(sed -n 's/^rust=//p' toolchain/apple.txt)"
          test -n "$rust_version"
          rustup toolchain install "$rust_version" --profile minimal
          rustup target add --toolchain "$rust_version" \
            aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios \
            aarch64-apple-tvos aarch64-apple-tvos-sim

      - name: Build GPL version (${{ matrix.name }})
        run: |
          make build use-prebuilt libs=${{ needs.plan.outputs.stale_apple }} platform=${{ matrix.platforms }}

      - name: Check spatial slices and combined archive links (${{ matrix.platform_type }})
        shell: bash
        run: |
          mpv_version="$(uv run --no-project python -c 'import json; print(json.load(open("versions.json"))["components"]["mpv"]["version"])')"
          bash scripts/test_spatial_archives.sh "dist/libmpv-$mpv_version" "${{ matrix.platform_type }}"

      - name: Name per-platform binaries by content (${{ matrix.platform_type }})
        run: |
          python3 scripts/keys.py record-platform \
            --platform-group apple \
            --platform ${{ matrix.platform_type }} \
            --release-dir dist/release

      # A rebuild of a published key has to reproduce its bytes (publish-assets
      # refuses anything else), so no file may carry a build's clock. A stamp
      # publishes fine once and fails only the rebuild, weeks later.
      - name: Check the zips for a build date (${{ matrix.name }})
        run: bash scripts/test_build_date.sh dist/release/*.zip

      - name: Upload platform build (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.name }}
          path: |
            ./dist/release/*.zip
            ./dist/release/*.checksum.txt
          if-no-files-found: error

  publish-apple:
    name: Package apple
    needs: build-apple
    permissions:
      contents: write
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: apple-*
          path: ./dist/partials

      - name: Merge platform XCFrameworks
        run: python3 scripts/merge_xcframeworks.py dist/partials dist/release

      - name: Check the merged XCFrameworks for a build date
        run: bash scripts/test_build_date.sh dist/release/*.zip

      - name: Name frameworks by content and record them
        run: python3 scripts/keys.py record-frameworks --platform-group apple --release-dir dist/release

      - name: Render Package.swift from the manifest
        run: python3 scripts/keys.py render --platform-group apple

      - name: Verify manifest matches this commit
        run: python3 scripts/keys.py verify --platform-group apple

      - name: Link Objective-C-only SwiftPM consumers on iOS and tvOS
        run: |
          brew install xcodegen
          bash scripts/test_spatial_swiftpm.sh dist/release

      - name: Upload binaries that are not published yet
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/keys.py publish-assets --platform-group apple

      - name: Upload manifest for the commit job
        uses: actions/upload-artifact@v4
        with:
          name: manifest-apple
          path: |
            ./artifacts.json
            ./Package.swift
          if-no-files-found: error

  build-android:
    name: Build android ${{ matrix.abi }}
    needs: plan
    if: contains(needs.plan.outputs.stale_groups, ',android,')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # One job per ABI: the driver builds one architecture per --arch invocation
    # (platforms/android/build.sh), the ABIs share nothing but sources, and the
    # dependency graph is expensive enough that four runners beat one.
    strategy:
      fail-fast: false
      matrix:
        # arch is the driver's spelling (loadarch.sh), abi the group.json
        # variant the tarball and the manifest are named by.
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: armv7l
            abi: armeabi-v7a
          - arch: x86
            abi: x86
          - arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      # Host build tools from apt plus the exact NDK pinned in
      # toolchain/android.txt (part of every android content key).
      - name: Install host toolchain and pinned NDK
        run: bash platforms/android/include/download-sdk.sh

      - name: Fetch and patch pinned sources
        run: bash platforms/android/download.sh

      - name: Build libmpv-android (${{ matrix.abi }})
        run: bash platforms/android/build.sh --arch ${{ matrix.arch }}

      # package.sh emits the unkeyed name (libmpv-android-<abi>.tar.gz): the
      # content key covers the published driver, which this leg cannot know is
      # final yet. The build leg uploads it as-is and record-platform renames
      # it to the group.json assetPattern's content-addressed spelling below.
      - name: Package per-ABI tarball (${{ matrix.abi }})
        run: bash platforms/android/package.sh --arch ${{ matrix.arch }}

      # A rebuild of a published key has to reproduce its bytes (publish-assets
      # refuses anything else), so no file may carry a build's clock. A stamp
      # publishes fine once and fails only the rebuild, weeks later.
      - name: Check the tarball for a build date (${{ matrix.abi }})
        run: bash scripts/test_build_date.sh dist/release/libmpv-android-${{ matrix.abi }}.tar.gz

      - name: Upload platform build (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: ./dist/release/*.tar.gz
          if-no-files-found: error

  build-linux:
    name: Build linux ${{ matrix.arch }}
    needs: plan
    if: contains(needs.plan.outputs.stale_groups, ',linux,')
    permissions:
      contents: read
    # The aarch64 leg runs on GitHub's native arm runner: toolchain/linux.txt
    # pins the container image by multi-arch index digest, so the same
    # container-build.sh invocation resolves the arm64 image natively -- no
    # qemu, and the glibc floor is identical to the x86_64 leg's.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # KEY makes container-build.sh run package.sh inside the container, so
      # the tarball comes out already named by content; ARCH pins the name's
      # architecture tag to the runner this leg was scheduled on.
      - name: Build and package in the pinned container (${{ matrix.arch }})
        run: |
          KEY="$(python3 scripts/keys.py keys --platform-group linux \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["libmpv-linux"])')"
          KEY="${KEY}" ARCH=${{ matrix.arch }} bash platforms/linux/container-build.sh

      # A rebuild of a published key has to reproduce its bytes (publish-assets
      # refuses anything else), so no file may carry a build's clock.
      - name: Check the tarball for a build date (${{ matrix.arch }})
        run: bash scripts/test_build_date.sh dist/release/*.tar.zst

      - name: Upload platform build (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ./dist/release/*.tar.zst
          if-no-files-found: error

  build-windows:
    name: Build windows ${{ matrix.arch }}
    needs: plan
    if: contains(needs.plan.outputs.stale_groups, ',windows,')
    permissions:
      contents: read
    # Both target arches cross-compile from an x86_64 host: winbuild's
    # GCC_ARCH probe runs the HOST compiler with -march=x86-64 and fails on
    # arm64 hosts, and aarch64-w64-mingw32 only needs the clang toolchain,
    # which build.sh hardcodes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      # Core set validated through the pinned configure (git..libtool;
      # unzip+patch are hard configure requirements, zip is for package.sh),
      # plus the winbuild README ubuntu set the full ~60-package graph needs.
      # libc++-dev and lld: the llvm bootstrap compiles with the host clang
      # against libc++. meson comes from pip, exactly as the winbuild README
      # instructs: apt meson (1.3.2 on noble) passes winbuild's >=1.3.0
      # configure gate but the branch-tip packages want current meson --
      # fontconfig main already requires >= 1.11.0.
      - name: Install dependencies
        run: |
          # The runner image ships Google's Chrome apt source, which has
          # served a mismatching index more than once; nothing here uses it.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build build-essential pkg-config curl unzip \
            zip patch ca-certificates python3 autoconf automake libtool \
            libtool-bin bison flex gettext mercurial subversion gyp yasm nasm \
            gcc-multilib g++-multilib clang lld libc++-dev libc++abi-dev \
            libgmp-dev libmpfr-dev libmpc-dev libgcrypt-dev gperf ragel \
            texinfo autopoint re2c asciidoc rst2pdf python3-docutils \
            python3-mako python3-jsonschema p7zip-full ccache
          python3 -m pip install --break-system-packages meson
          meson --version

      # pin_packages.py is the one place that resolves the windows pin, so the
      # cache key below cannot describe a different commit than build.sh
      # fetches.
      - name: Resolve the winbuild pin
        id: winbuild
        run: |
          read -r _ commit < <(python3 platforms/windows/pin_packages.py --print-winbuild-pin)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      # The llvm/rust bootstrap takes hours and the dependency graph builds
      # ~60 packages, so the whole build state is cached, mirroring upstream
      # winbuild's own CI (mpv_clang.yml caches src_packages, clang_root and
      # the entire per-arch build tree). Skipping is stamp-driven ninja:
      # an ExternalProject step re-runs only when its stamp is missing/older
      # or its command line changed, and ninja treats an edge absent from
      # .ninja_log as changed -- so the per-arch tree (stamps + .ninja_log +
      # installed prefix + ccache) is the unit of caching, not a hand-picked
      # subset. pin_packages.py suppresses upstream's check-git step, which
      # is otherwise absent from cold graphs and cascades a full rebuild on
      # its first warm appearance.
      # Correctness of reuse: dep sources can only move through the winbuild
      # commit, and the three packages pin_packages.py rewrites get new step
      # command lines whenever versions.json pins or the patch series change,
      # which dirties exactly those packages; build.sh fullcleans mpv every
      # run (upstream's BUILDDATE naming dirties its packaging steps daily,
      # and libmpv must relink against whatever changed underneath it anyway)
      # and always runs the toolchain targets -- no-ops when clean -- which
      # makes the last, pin-free restore tier safe across winbuild bumps.
      # The pins tier prefers a completed state over an older one; the run_id
      # suffix keeps every run's save unique so failed bootstraps still
      # checkpoint their progress.
      - name: Restore build state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/windows/${{ matrix.arch }}
            build/windows/src
            build/windows/rustup
          key: windows-ep2-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-${{ hashFiles('versions.json', 'patches/**') }}-${{ github.run_id }}
          restore-keys: |
            windows-ep2-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-${{ hashFiles('versions.json', 'patches/**') }}-
            windows-ep2-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-
            windows-ep2-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-

      - name: Build libmpv-windows (${{ matrix.arch }})
        run: bash platforms/windows/build.sh ${{ matrix.arch }}

      # package.sh names the zip by content key itself, so the build leg
      # uploads it as-is; publish records every variant at once.
      - name: Package dev zip (${{ matrix.arch }})
        run: bash platforms/windows/package.sh ${{ matrix.arch }}

      # A rebuild of a published key has to reproduce its bytes (publish-assets
      # refuses anything else), so no file may carry a build's clock. The scan
      # reaches back to 2020: a restored build tree keeps the stamps of the
      # runs that compiled each package, weeks before this one.
      - name: Check the zip for a build date (${{ matrix.arch }})
        run: bash scripts/test_build_date.sh dist/release/*.zip

      - name: Save build state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/windows/${{ matrix.arch }}
            build/windows/src
            build/windows/rustup
          key: windows-ep2-${{ matrix.arch }}-${{ hashFiles('toolchain/windows.txt') }}-${{ steps.winbuild.outputs.commit }}-${{ hashFiles('versions.json', 'patches/**') }}-${{ github.run_id }}

      - name: Upload platform build (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: ./dist/release/*.zip
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.group }}
    # One recipe for every group.json group. The only per-group inputs are data:
    # the group name and its artifact glob, both of which come from the group's
    # own group.json (via `keys.py groups`/`variants`) rather than being
    # restated here.
    needs: [plan, build-android, build-linux, build-windows]
    # always(): a group with nothing stale has a *skipped* build job, and a
    # skipped need would otherwise skip this job -- silently publishing nothing
    # and leaving the commit unpinnable. The per-row gate below decides which
    # rows actually act; `!cancelled()` keeps a superseded run from publishing.
    if: always() && !cancelled() && inputs.publish && needs.plan.outputs.stale_groups != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: android
            artifacts: android-*
          - group: linux
            artifacts: linux-*
          - group: windows
            artifacts: windows-*
    steps:
      - uses: actions/checkout@v4

      # A group with nothing stale keeps its committed section and is skipped
      # rather than published; the manifest job's gate below is what proves
      # every stale group got here.
      - name: Skip groups with nothing stale
        id: stale
        env:
          STALE_GROUPS: ${{ needs.plan.outputs.stale_groups }}
          PLATFORM_GROUP: ${{ matrix.group }}
        run: |
          if [[ "$STALE_GROUPS" == *",$PLATFORM_GROUP,"* ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "$PLATFORM_GROUP: nothing stale, keeping the committed section"
          fi

      # actions/download-artifact has no fail-on-empty input: a pattern that
      # matches nothing logs "Total of 0 artifact(s) downloaded" and succeeds,
      # and record-platform below only records what exists. The run is still
      # closed by `keys.py verify` two steps down: it fails whenever the
      # manifest does not describe the artifacts this commit has to publish.
      - name: Download platform builds
        if: steps.stale.outputs.stale == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.artifacts }}
          path: ./dist/partials

      - name: Collect release assets
        if: steps.stale.outputs.stale == 'true'
        run: |
          mkdir -p dist/release
          find dist/partials -type f -exec cp -v {} dist/release/ \;

      # For group.json groups record-platform is the verb that writes the
      # manifest section, so it runs here -- once per variant against the
      # merged release dir -- not in the build legs, whose partial manifests
      # would each carry a single variant.
      - name: Record variants in the manifest
        if: steps.stale.outputs.stale == 'true'
        run: |
          # Capture the substitution instead of inlining it: a command
          # substitution in a `for` word list does not propagate its exit
          # status, even under `set -eo pipefail` -- the failed substitution
          # expands to an empty list and the loop body never runs, which
          # reports success. A keys.py traceback would then record zero
          # variants and look like a group with nothing to record.
          variants="$(python3 scripts/keys.py variants --platform-group ${{ matrix.group }})"
          if [ -z "${variants}" ]; then
            echo "FAIL: no variants for ${{ matrix.group }}" >&2
            exit 1
          fi
          for variant in ${variants}; do
            python3 scripts/keys.py record-platform \
              --platform-group ${{ matrix.group }} \
              --platform "${variant}" \
              --release-dir dist/release
          done

      - name: Verify manifest matches this commit
        if: steps.stale.outputs.stale == 'true'
        run: python3 scripts/keys.py verify --platform-group ${{ matrix.group }}

      - name: Upload binaries that are not published yet
        if: inputs.publish && steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/keys.py publish-assets --platform-group ${{ matrix.group }}

      - name: Upload manifest for the commit job
        if: steps.stale.outputs.stale == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.group }}
          path: ./artifacts.json
          if-no-files-found: error

  manifest:
    name: Commit manifest
    # All-or-nothing composition: every group the plan job marked stale must
    # have published a manifest, and at least one group must have published
    # (all-clean runs have nothing to splice and are fully verified by the plan
    # job). The gate reads the plan's stale list and the downloaded manifests
    # rather than restating per-group job names, so a group added to
    # platforms/*/group.json cannot be silently skipped.
    needs: [plan, publish-apple, publish]
    # always(): this gate is what proves a group that was stale actually
    # published, so it must run even when one of them failed.
    if: always() && !cancelled() && inputs.publish && needs.plan.outputs.stale_groups != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download group manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: ./dist/manifests

      - name: Check every stale group published
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          # ",apple,android," -> ["apple", "android"]
          stale = [g for g in os.environ['STALE_GROUPS'].strip(',').split(',') if g]
          present = {p.name[len('manifest-'):] for p in Path('dist/manifests').glob('manifest-*')}
          missing = [group for group in stale if group not in present]
          if missing:
              print(f'FAIL: {", ".join(missing)} was stale but published no manifest')
              raise SystemExit(1)
          print(f'every stale group published: {", ".join(stale)}')
          PY
        env:
          STALE_GROUPS: ${{ needs.plan.outputs.stale_groups }}

      # Each group's publish job rewrote only its own platforms.<group> section
      # of artifacts.json (keys.py re-serializes the rest untouched), so
      # splicing every downloaded section into the checked-out manifest
      # composes the groups. The serialization below matches keys.py
      # save_manifest byte for byte.
      - name: Splice group sections into artifacts.json
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          manifest_path = Path('artifacts.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          partials = sorted(Path('dist/manifests').glob('manifest-*'))
          if not partials:
            raise SystemExit('no group manifests were downloaded')

          for partial in partials:
            group = partial.name[len('manifest-'):]
            data = json.loads((partial / 'artifacts.json').read_text(encoding='utf-8'))
            manifest['platforms'][group] = data['platforms'][group]
            print(f'spliced platforms.{group}')
            if group == 'apple':
              # Package.swift is rendered from the apple section alone.
              shutil.copy2(partial / 'Package.swift', 'Package.swift')

          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Check for manifest changes
        id: changes
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain -- Package.swift artifacts.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # No pull/rebase before this: if main moved while the binaries were
      # building, this run is superseded and its push is meant to be rejected.
      # Rebasing would land a manifest computed from an older tree on top of the
      # newer one, which is exactly the skew `verify` exists to prevent; the
      # queued run for the newer commit publishes the right manifest instead.
      # The assets uploaded above are content-addressed, so that run reuses them.
      - name: Push binary manifest
        if: steps.changes.outputs.changed == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          add: |
            - Package.swift
            - artifacts.json
          message: "chore: binaries for ${{ steps.changes.outputs.short_sha }} [skip binaries]"
          push: "origin HEAD:${{ github.ref_name }}"
